<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Registration Form</title>

    <style>
        *{
            margin:0;
            padding:0;
            box-sizing:border-box;
            font-family:Arial, sans-serif;
        }

        body{
            background:#f4f4f4;
            display:flex;
            justify-content:center;
            align-items:center;
            min-height:100vh;
        }

        .container{
            width:400px;
            background:white;
            padding:20px;
            border-radius:10px;
            box-shadow:0 0 10px rgba(0,0,0,0.2);
        }

        h2{
            text-align:center;
            margin-bottom:20px;
        }

        label{
            display:block;
            margin-top:10px;
            font-weight:bold;
        }

        input,
        select,
        textarea{
            width:100%;
            padding:10px;
            margin-top:5px;
            border:1px solid #ccc;
            border-radius:5px;
        }

        .gender{
            margin-top:10px;
        }

        .gender input{
            width:auto;
            margin-right:5px;
        }

        button{
            width:100%;
            padding:12px;
            margin-top:20px;
            background:#007bff;
            color:white;
            border:none;
            border-radius:5px;
            cursor:pointer;
            font-size:16px;
        }

        button:hover{
            background:#0056b3;
        }
    </style>
</head>
<body>

    <div class="container">
        <h2>Registration Form</h2>

        <form>

            <label for="fullname">Full Name</label>
            <input type="text" id="fullname" placeholder="Enter Full Name" required>

            <label for="email">Email</label>
            <input type="email" id="email" placeholder="Enter Email" required>

            <label for="password">Password</label>
            <input type="password" id="password" placeholder="Enter Password" required>

            <label for="phone">Phone Number</label>
            <input type="tel" id="phone" placeholder="Enter Phone Number">

            <label for="gender">Gender</label>
            <div class="gender">
                <input type="radio"  placeholder="Gender" name="gender" value="male"> Male

                <input type="radio" placeholder="Gender" name="gender" value="female"> Female

                <input type="radio" placeholder="Gender" name="gender" value="other"> Other
            </div>

            <label for="course">Course</label>
            <select id="course">
                <option>Select Course</option>
                <option>Java Full Stack</option>
                <option>Python Full Stack</option>
                <option>Data Science</option>
                <option>UI/UX Design</option>
            </select>

            <label for="address">Address</label>
            <textarea id="address" rows="4" placeholder="Enter Address"></textarea>

            <button type="submit">Register</button>

        </form>
    </div>

</body>
</html>
